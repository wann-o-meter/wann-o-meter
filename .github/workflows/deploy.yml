name: Deploy

on:
  push:
    branches: [main]

jobs:
  # The Python pipeline writes data/, which the site build then validates - but
  # nothing here checked it until now, so a broken pipeline only showed up
  # locally. Runs in parallel with the deploy job: it guards contributions to
  # pipeline/, and must not hold up publishing a data-only change.
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: uv run pytest -q

  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: wann-o-meter/wann-o-meter.github.io
          publish_branch: main
          publish_dir: dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
