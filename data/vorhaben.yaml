# Every vertical the site plans. Order here is the order shown on the site.
# slug matches the data/<slug>/ folder and the URL segment.
- slug: umzug
  label: Umzug
  teaser: Kündigung, Ummeldung, Halteverbot
  # backwards: the Fristen run up to the anchor, forwards: the clock starts there.
  direction: backwards
  description: >-
    Ort und Umzugstag eingeben, kompletten Rückwärts-Zeitplan mit Fristen sehen -
    mit Wochenend- und Feiertagswarnung.
  vorhaben: Umzug innerhalb Deutschlands
  possessive: Dein
  anchorLabel: Umzugstag
  anchorName: Umzug
  tags: [wohnen]
  variantLabel: Ort
  variantPreposition: nach
  # Bundesweit by default: a city is an addition to the plan, not a prerequisite.
  defaultVariant: bundesweit

- slug: geburt
  label: Geburt
  teaser: Elterngeld, Kindergeld, Urkunde
  direction: forwards
  titleSubject: Nach der Geburt
  description: >-
    Geburtstermin eingeben, Fristen für Geburtsanzeige, Elterngeld und Kindergeld
    rückwärts geplant - mit Quelle.
  vorhaben: Geburt eines Kindes
  possessive: Deine
  anchorLabel: Geburtstermin
  anchorName: Geburt
  tags: [familie]
  variantLabel: Ort

- slug: heirat
  label: Hochzeit
  teaser: Standesamt, Urkunden, Namen
  direction: backwards
  description: >-
    Hochzeitstermin eingeben, Anmeldung beim Standesamt, Dokumente und
    Namensänderung rückwärts geplant.
  vorhaben: Standesamtliche Hochzeit
  possessive: Deine
  anchorLabel: Hochzeitstermin
  anchorName: Hochzeit
  tags: [familie]
  variantLabel: Ort

- slug: jobwechsel
  label: Jobwechsel
  teaser: Kündigung, Arbeitsagentur, Zeugnis
  direction: backwards
  # The anchor as the title says it, after "vom".
  anchorDative: letzten Arbeitstag
  description: >-
    Letzten Arbeitstag eingeben, Kündigungsfrist und Arbeitsuchendmeldung
    rückwärts geplant - mit Quelle.
  vorhaben: Jobwechsel
  possessive: Dein
  anchorLabel: Letzter Arbeitstag
  anchorName: Jobwechsel
  tags: [arbeit]
  variantLabel: Ort
