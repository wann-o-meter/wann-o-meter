# Steps that apply to any birth in Germany, independent of Kommune.
# Anchor date is the birth date. offset_days below are generic ballpark
# figures (common-knowledge checklist items), not all verified-per-source
# facts yet - source_url stays null until someone checks a given deadline
# against its actual Gesetz and fills in a real link. Where it's filled in,
# the URL and its content were checked directly against
# gesetze-im-internet.de, not assumed.
deadlines:
  - ref: geburtsanzeige-standesamt
  - ref: elterngeld-beantragen
  - ref: kindergeld-beantragen
  - id: krankenversicherung-kind-anmelden
    kind: soft
    label: Kind bei der Krankenversicherung anmelden
    offset_days: 60
    source_url: null
    note: Gesetzlich familienversichert meist beitragsfrei. Privat gilt oft eine Frist ohne Gesundheitsprüfung. Frist nicht verifiziert, bei der Kasse nachfragen.
  - id: geburtsurkunde-beantragen
    kind: soft
    label: Geburtsurkunden beim Standesamt beantragen
    offset_days: 14
    source_url: null
    no_source_needed: true
    note: Keine gesetzliche Frist, aber mehrere Ausfertigungen (Elterngeld, Kindergeld, Versicherung) werden schnell gebraucht.
