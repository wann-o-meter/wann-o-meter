# Steps that apply to a job change (own resignation) in Germany, independent
# of Kommune. Anchor date is the last working day at the old employer, not
# the first day at the new one - the legal deadlines here (Kündigungsfrist,
# Arbeitsuchendmeldung) all count from that end date.
# offset_days below are generic ballpark figures (common-knowledge checklist
# items), not all verified-per-source facts yet - source_url stays null until
# someone checks a given deadline against its actual Gesetz and fills in a
# real link.
deadlines:
  - id: kuendigungsfrist-pruefen
    kind: statutory-relative
    direction: before
    label: Kündigungsfrist einhalten und kündigen
    offset_days: -28
    source_url: https://www.gesetze-im-internet.de/bgb/__622.html
    source_label: § 622 Abs. 1 BGB
    note: Grundfrist vier Wochen zum 15. oder zum Monatsende, sofern Arbeits- oder Tarifvertrag nichts Längeres vorsehen. Die längeren Fristen nach § 622 Abs. 2 BGB gelten nur für Kündigungen durch den Arbeitgeber.
  - id: arbeitsuchend-melden
    kind: statutory-relative
    direction: before
    label: Bei der Agentur für Arbeit arbeitsuchend melden
    offset_days: -90
    source_url: https://www.gesetze-im-internet.de/sgb_3/__38.html
    source_label: § 38 Abs. 1 SGB III
    note: Spätestens drei Monate vor Ende des Arbeitsverhältnisses. Wird das Ende später bekannt, gilt eine Frist von drei Tagen nach Kenntnis.
  - id: krankenkasse-informieren
    kind: soft
    label: Neuen Arbeitgeber und Krankenkasse über Wechsel informieren
    offset_days: 0
    source_url: null
    note: Für eine lückenlose Versicherung wichtig - genaue Fristen bei der eigenen Krankenkasse erfragen, nicht verifiziert.
  - id: arbeitszeugnis-resturlaub-klaeren
    kind: soft
    label: Arbeitszeugnis anfordern und Resturlaub klären
    offset_days: -14
    source_url: null
    no_source_needed: true
