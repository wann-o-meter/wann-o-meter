  \ # Jüdische Feiertage 2026\n Jeder Festtag beginnt am Vorabend, denn im j&uuml;dischen\
  \ Kalender dauert der Tag vom Vorabend(Erew) bis zum Abend des Folgetages.\n **02./03.03.2026**\n\
  \ ### 14. Adar Purim\n ist ein Freudenfest, welches Erinnerungen an Fasching hochkommen\
  \ l&auml;sst. Es wird sich kost&uuml;miert und in den Stra&szlig;en gefeiert. Man\
  \ gibt einander Geschenke und spendet Speisen f&uuml;r Bed&uuml;rftige. Zu Purim\
  \ gedenken wir der Befreiung der persischen Juden im 5. Jahrhundert vor unserer\
  \ Zeit. Der h&ouml;chste Regierungsbeamte des persischen K&ouml;nigs, Hamman, wollte\
  \ aus Rache das gesamte j&uuml;dische Volk im Persischen Reich an einem Tag ermorden\
  \ lassen. Ester, die K&ouml;nigin, hat sich beim persischen K&ouml;nig f&uuml;r\
  \ die Rettung ihres Volkes eingesetzt, und der K&ouml;nig erlaubte daraufhin dem\
  \ j&uuml;dischen Volk, sich zu verteidigen.\n **01./02.-09.04.2026**\n ### 14. -\
  \ 20. Nissan Pessach\n Das Pessach Fest erinnert an den Auszug (Exodus) des j&uuml;dischen\
  \ Volkes aus &Auml;gypten (Mizrajim). Mit dem Fest wird das Ende der Sklaverei des\
  \ j&uuml;dischen Volkes gefeiert. Noch heute wird im Gedenken an dieses Ereignis\
  \ nur Unges&auml;uertes (Matzot) gegessen, weil der pl&ouml;tzliche Aufbruch aus\
  \ &Auml;gypten es nicht gestattete, den Brotteig vor dem Backen s&auml;uern zu lassen.\
  \ Pessach ist der erste Pilgertag nach Jerusalem.\n **14.04.2026**\n ### 27. Nissan&nbsp;Jom\
  \ ha-Schoa\n Jom ha-Schoa ist der Gedenktag f&uuml;r die Opfer der Schoa und der\
  \ Widerstandsk&auml;mpfer - und K&auml;mpferinnen in den Gettos. Diesen Gedenktag\
  \ gibt es in Israel seit 1951. Im Laufe des Vormittags ert&ouml;nen dort landesweit\
  \ Sirenen und das &ouml;ffentliche Leben ruht f&uuml;r zwei Minuten. Auch in den\
  \ j&uuml;dischen Gemeinden in Deutschland finden an Jom ha-Schoa Gedenkfeiern statt.\n\
  \ **21./22.-23.05.2026**\n ### 06. - 07. Ssiwan Schawuot\n Das Fest wird als Tag,\
  \ an dem die Thora gegeben war, gefeiert. Schawuot erinnert an die Ereignisse am\
  \ Berg Sinai, und an das Schlie&szlig;en des Bundes zwischen Israeliten und dem\
  \ Ewigen. Es ist einer der drei Pilgerfeiertage nach Jerusalem.\n **22./23.07.2026**\n\
  \ ### 09. Aw Tischa be-Aw\n Der Neunte des Monats Aw, ist ein Fastentag, an dem\
  \ an die Zerst&ouml;rung beider Tempel in Jerusalem erinnert wird. Der 1. Tempel\
  \ - von Salomon existierte 410 Jahre, der 2. Tempel stand 420 Jahre.\n **11./12.-13.09.2026**\n\
  \ ### 01. &ndash; 02. Tischri Rosch ha-Schana Neujahrsfest\n ist das J&uuml;disches\
  \ Neujahrsfest und Beginn des Jahres. Es wird als Tag des Gerichts (Jom ha-Din)\
  \ begangen, an dem alle Gesch&ouml;pfe vor den &bdquo;himmlischen&ldquo; Richter\
  \ treten. Der &bdquo;Tag&ldquo; dauert 48 Stunden. Schofar T&ouml;ne, die an dem\
  \ Tag erklingen, leiten die Menschen zur Bu&szlig;e und Reue, welche den Menschen\
  \ ihrerseits zu Teschuwa, die R&uuml;ckkehr zum Sch&ouml;pfer erleichtern. Wir hoffen\
  \ auf ein gutes kommendes Jahr und w&uuml;nschen einander: שנה טובה (ein Gutes Jahr)\
  \ schana tova\n **20./21.09.2026**\n ### 10. Tischri Jom Kippur Vers&ouml;hnungstag\n\
  \ ist einer der wichtigsten Feiertage des j&uuml;dischen Jahres. So ist der Vers&ouml;hnungstag\
  \ ein Tag der Reue, der Bu&szlig;e und der Umkehr. Von kurz vor Sonnenuntergang\
  \ des Vortags bis zum n&auml;chsten Sonnenuntergang wird weder fl&uuml;ssige noch\
  \ feste Nahrung eingenommen. Das &ouml;ffentliche Leben kommt fast vollst&auml;ndig\
  \ zum Erliegen. Auch Radio- und TV-Stationen zeigen kein Programm.\n **25./26.09.-02.10.2026**\n\
  \ ### 15. &ndash; 21. Tischri Sukkot Laubh&uuml;ttenfest\n ist das letzte Fest der\
  \ Pilgertage nach Jerusalem. Sukkot ist ein Dankesfest und hat eine doppelte Bedeutung.\
  \ Zum einen geht es um den Dank f&uuml;r das Einbringen der Ernte, zum anderen erinnert\
  \ es an den Auszug aus &Auml;gypten. Bei der W&uuml;stenwanderung mussten die Israeliten\
  \ in nicht befestigten H&uuml;tten wohnen. Auch heute werden in vielen Familien\
  \ Laubh&uuml;tten zu *Sukkot* gebaut. Das Laubh&uuml;ttenfest dauert sieben Tage\
  \ lang.\n **02./03.-04.10.2026**\n ### 22. &ndash; 23. Tischri Schmini Azeret/Ssimchat\
  \ Tora Freude der Tora\n ist das Fest, an dem die F&uuml;nf B&uuml;cher Mose von\
  \ vorne zu lesen begonnen werden. Es markiert den Abschluss der Herbstfeiertage.\n\
  \ **04. - 12.12.2026**\n ### 25. Kislev - 2. Tewet Chanukka\n wird auch Lichterfest\
  \ genannt und gedenkt der Wiedereinweihung des Zweiten Tempels in Jerusalem, nach\
  \ der Sch&auml;ndung durch die hellenisierten Juden. Nach der &Uuml;berlieferung\
  \ darf die Menora, der siebenarmige Leuchter, im Tempel niemals erl&ouml;schen.\
  \ Aufgrund der kriegerischen Auseinandersetzungen wurde nur noch ein Krug geweihtes\
  \ &Ouml;l gefunden. Dieses &Ouml;l sollte nur f&uuml;r einen Tag reichen, doch es\
  \ brannte f&uuml;r acht Tage und somit genau die Zeit, die es ben&ouml;tigt, um\
  \ neues geweihtes &Ouml;l wiederherzustellen. An Chanukka wird an jedem Abend ein\
  \ neues weiteres Licht angez&uuml;ndet, um an dieses Wunder zu erinnern.\n &nbsp;\n\
