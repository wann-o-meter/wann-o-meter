  \ TOTALE SONNENFINSTERNISSE IN EUROPA 1951 - 2050\nIm Zusammenhang mit einer totalen\
  \ Sonnenfinsternis kommen eigentlich immer die folgenden zwei Fragen auf: \n- Wann\
  \ war an diesem Ort die letzte SoFi? \n- Wann wird hier die n&auml;chste sein? \n\
  Dank des von Fred Espenak* erstellten [World Atlas of Solar Eclipse Paths](http://eclipse.gsfc.nasa.gov/SEatlas/SEatlas.html)\
  \ lassen sich solche Fragen f&uuml;r den Zeitraum -2000 bis +3000 problemlos beantworten.\
  \ \nDie folgende Aufstellung umfasst die 10 in Europa sichtbaren totalen Sonnenfinsternisse\
  \ in der Periode 1951 bis 2050.\r\n Dark Days \r\n### 30.06.1954 ([Grafik von *Fred\
  \ Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot1951/SE1954Jun30T.GIF))\n\
  Sichtbarkeit in Europa:\nIsland, F&auml;r&ouml;er, Shetland Inseln, Norwegen, Schweden,\
  \ Lettland, Litauen, Polen, Weissrussland, Ukraine, Russland\r\n[SAROS 126](saros126/index.htm)\r\
  \nEine der bekanntesten Sonnenfinsternisse des 20. Jahrhunderts war die vom 30.\
  \ Juni 1954. In Skandinavien war sie total, in Deutschland waren bis zu 93% der\
  \ Sonnenscheibe vom Mond bedeckt. Es muss eine eindrucksvolle Himmelserscheinung\
  \ gewesen sein, die in der Erinnerung dann wohl noch etwas verkl&auml;rt wurde.\r\
  \n[R&Uuml;CKBLICK AUF SONNENFINSTERNIS.ORG](sofi1954t/index.htm)\r\n[Zum Seitenanfang](#kopf)\n\
  ### 15.02.1961 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot1951/SE1961Feb15T.GIF))\n\
  Sichtbarkeit in Europa:\nFrankreich, Monaco, Italien, Kroatien, Bosnien, Serbien,\
  \ Albanien, Mazedonien, Bulgarien, Rum&auml;nien, Ukraine, Russland, Kasachstan\r\
  \n[SAROS 120](http://eclipse.gsfc.nasa.gov/SEsaros/SEsaros120.html)\r\nEine weitere\
  \ legend&auml;re SoFi, die in Frankreich und Norditalien total war, fand am 15.\
  \ Februar 1961 statt. Originalaufnahmen dieser Sonnenfinsternis sind &uuml;brigens\
  \ in dem Film &quot;Barrabas&quot; zu sehen. In Mitteleuropa erreichte die partielle\
  \ Phase je nach geographischer Lage 80 bis 98%. Vielen &auml;lteren Mitb&uuml;rgern\
  \ d&uuml;rfte das Ereignis deshalb noch in Erinnerung sein.\r\n[R&Uuml;CKBLICK AUF\
  \ SONNENFINSTERNIS.ORG](sofi1961t/index.htm)\r\n[Zum Seitenanfang](#kopf)\n### 31.07.1981\
  \ ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot1951/SE1981Jul31T.GIF))\n\
  Sichtbarkeit in Europa:\nRussland\r\n[SAROS 145](http://eclipse.gsfc.nasa.gov/SEsaros/SEsaros145.html)\r\
  \nDie Zentralzone dieser Sonnenfinsternis streifte Europa im &auml;u&szlig;ersten\
  \ S&uuml;dosten n&ouml;rdlich des Kaukasus. Dieses Gebiet gehörte damals zur UDSSR\
  \ und es herrschte tiefste Eiszeit zwischen den Militärblöcken. Dennoch fanden einige\
  \ Finsternis-Enthusiasten aus westlichen Ländern ihren Weg zur Schwarzen Sonne.\
  \ Dies war &uuml;brigens die Saros-Vorg&auml;ngerin &quot;unserer&quot; 99er-SoFi.\r\
  \n[R&Uuml;CKBLICK AUF SONNENFINSTERNIS.ORG](sofi1981t/index.htm)\r\n[Zum Seitenanfang](#kopf)\n\
  ### 22.07.1990 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot1951/SE1990Jul22T.GIF))\n\
  Sichtbarkeit in Europa:\nFinnland, Russland\r\n[SAROS 126](saros126/index.htm)\r\
  \nDie Sonnenfinsternis am 22.07.1990 geh&ouml;rte zu dem gleichen Saros 126, der\
  \ die legend&auml;re 54er-Finsternis hervorgebracht hatte. Erstmals seit 1961 bot\
  \ sich f&uuml;r Mitteleurop&auml;er die Chance, eine totale Sonnenfinsternis praktisch\
  \ vor der Haust&uuml;r zu erleben, n&auml;m­lich in Südfinnland. Leider waren die\
  \ Bedin­gungen &auml;u&szlig;erst ung&uuml;nstig \x96 die Eclipse fand praktisch\
  \ bei Sonnenaufgang statt. Einige Gruppen setzten angesichts der hohen Bew&ouml;lkungswahr­scheinlichkeit\
  \ deshalb gleich auf eine Beobachtung aus Reiseflugh&ouml;he. Neben solchen Profis\
  \ gab es aber auch Sommer­urlauber, die erst vor Ort zuf&auml;llig von dem anstehenden\
  \ Ereignis erfuhren.\r\n[R&Uuml;CKBLICK AUF SONNENFINSTERNIS.ORG](sofi1990t/index.htm)\r\
  \n[Zum Seitenanfang](#kopf)\n### 11.08.1999 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot1951/SE1999Aug11T.GIF))\n\
  Sichtbarkeit in Europa:\nEngland, Frankreich, Belgien, Luxemburg, Deutschland, &Ouml;sterreich,\
  \ Slowenien, Ungarn, Serbien, Rum&auml;nien, Bulgarien\r\n[SAROS 145](http://eclipse.gsfc.nasa.gov/SEsaros/SEsaros145.html)\r\
  \nDie Sofi am 11.08.1999 war das gr&ouml;&szlig;te astronomische Ereignis seit der\
  \ Mondlandung. Die Verkehrsstaus sind genauso zur Legende geworden, genauso wie\
  \ das Wetter an jenem Tag. Zumindest in Eng­land, Frankreich und Deutschland sah\
  \ kaum jemand die Schwarze Sonne. Man brauchte schon Glück, um eines der wenigen\
  \ Wol­kenl&ouml;cher zu erwischen, wie z.B. in der Karlsruher Innenstadt. ARD und\
  \ ZDF, deren Live-Sendungen zur SoFi Quo­tenhits wurden, waren auf Nummer sicher\
  \ gegangen und hatten ein Flugzeug gechartert. Auf der sicheren Seite waren auch\
  \ diejenigen, die sich bereits am Abend des 10.08.99 in ihren PKW gesetzt hatten\
  \ und es daher bis in den Osten &Ouml;sterreichs oder sogar nach Ungarn schaff­ten:\
  \ dort war das Wetter n&auml;mlich einwand­frei. \n[R&Uuml;CKBLICK AUF SONNENFINSTERNIS.ORG](sofi1999t/index.htm)\r\
  \n[Zum Seitenanfang](#kopf)\n### 29.03.2006 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot2001/SE2006Mar29T.GIF))\n\
  Sichtbarkeit in Europa:\nGriechenland, Russland, Kasachstan\n[SAROS 139](http://eclipse.gsfc.nasa.gov/SEsaros/SEsaros139.html)\r\
  \nDie Zentralzone der totalen Sonnenfinsternis am 29.03.2006 zog sich u.a. &uuml;ber\
  \ das Mittelmeergebiet und das Schwarze Meer. Fast im gleichen Gebiet wie die Finsternis\
  \ von 1981 ber&uuml;hrte sie n&ouml;rdlich des Kaukasus europ&auml;ischen Boden.\
  \ Diese SoFi wurde daher zum touristischen Gro&szlig;ereignis. Libyen, ein noch\
  \ vor wenigen Jahren weitgehend isoliertes Land, wurde von mehr Touristen besucht\
  \ als sonst in einem ganzen Jahr. Gesch&auml;tzte 5000 Beob­achter versammelten\
  \ sich in 3 Camps in der Sahara und erlebten die wohl sch&ouml;nste Sonnenfinsternis\
  \ seit Jahrzehnten. \r\nLibyen bot statistisch die besten Wetteraus­sichten, doch\
  \ auch diejenigen, die nach &Auml;gypten und in die T&uuml;rkei gereist waren, bekamen\
  \ eine prachtvolle Finsternis zu sehen.\r\n[R&Uuml;CKBLICK AUF SONNENFINSTERNIS.ORG](sofi2006t/index.htm)\r\
  \n[Zum Seitenanfang](#kopf)\n### 01.08.2008 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot2001/SE2008Aug01T.GIF))\n\
  Sichtbarkeit in Europa:\nRussland\n[SAROS 126](saros126/index.htm)\r\nDer uns bereits\
  \ gut bekannte Saros 126 stattete dem &auml;u&szlig;ersten Nordosten Europas am\
  \ 01.08.2008 einen erneuten Besuch ab. Die Zentralzone zog sich &uuml;ber die zum\
  \ Svalbard-Archipel geh&ouml;rende unbewohnte Insel Hvit&ouml;ya und &uuml;ber das\
  \ russische Novaja Semlja. Das Festland erreichte der Kernschatten gegen Mittag\
  \ dann auf der asiatischen Seite des Urals. Die meisten SoFi-Fans reisten nach Novosibirsk,\
  \ in die Mongolei und an die chinesische Seitenstra&szlig;e, wo bei klarem Wetter\
  \ eine der beeindruckensten Sonnenfinsternisse der vergangenen Jahrzehnte zu beobachten\
  \ war. Doch gar nicht so wenige Interessenten erwarteten die Schwarze Sonne auf\
  \ einem Eisbrecher in der europ&auml;ischen Arktis - mit gemischtem Erfolg. Wer\
  \ kein Risiko eingehen mochte, buchte einen Beobachtungsflug zum Nordpol.\n[R&Uuml;CKBLICK\
  \ AUF SONNENFINSTERNIS.ORG](sofi2008t/index.htm)\r\n[Zum Seitenanfang](#kopf)\n\
  ### 20.03.2015 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot2001/SE2015Mar20T.GIF))\n\
  Sichtbarkeit in Europa:\nF&auml;r&ouml;er, Svalbard\n[SAROS 120](http://eclipse.gsfc.nasa.gov/SEsaros/SEsaros120.html)\r\
  \nDie SoFi am 20.03.2015 begann im Nordatlantik etwa 700 Kilometer s&uuml;dlich\
  \ der gr&ouml;nl&auml;ndischen S&uuml;dk&uuml;ste. Der Kernschatten zog nun nach\
  \ Nordosten und verfehlte Ostisland nur um etwa 70 Kilometer, &uuml;berquerte aber\
  \ die F&auml;r&ouml;er-Inseln. Auf der Inselgruppe schwankte die Dauer zwischen\
  \ 1 Minute 41 Sekunden im S&uuml;den und 2 Minuten 32 Sekunden im Norden. In der\
  \ Hauptstadt T&oacute;rshavn, die in gro&szlig;en des Stadtgebietes gute Beobachtungsm&ouml;glichkeiten\
  \ bot, waren es 2 Minuten 18 Sekunden, wobei die Sonne knapp 20 Grad &uuml;ber dem\
  \ Horizont stand. \r\nDer Finsternispfad zog nun weiter Richtung Norden. Bevor der\
  \ Kernschatten nur 70 Kilometer vom Nordpol entfernt die Erde verlie&szlig;, &uuml;berquerte\
  \ er noch den norwegischen Svalbard-Archipel. Longyearbyen, der Hauptort dieser\
  \ arktischen Inselgruppe, lag fast auf der Zentrallinie. Die Dauer der totalen Phase\
  \ betrug hier bei einer Sonnenh&ouml;he von rund 11 Grad 2 Minuten 31 Sekunden.\n\
  [R&Uuml;CKBLICK AUF SONNENFINSTERNIS.ORG](sofi2015t/index.htm)\r\n[Zum Seitenanfang](#kopf)\n\
  ### 12.08.2026 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot2001/SE2026Aug12T.GIF))\n\
  Sichtbarkeit in Europa:\nIsland, Portugal, Spanien, Balearen\n[SAROS 126](saros126/index.htm)\r\
  \nAm 12.08.2026 beschert Saros 126 Europa bereits die 4. totale Sonnenfinsternis\
  \ seit 1954. Die Zentralzone zieht durch das Nordpolarmeer knapp am Nordpol vorbei\
  \ und dann entlang der Ostk&uuml;ste Gr&ouml;nlands. Erst am Nachmittag erreicht\
  \ der Kernschatten im Westen Islands bewohnte Gefilde. In Nordspanien trifft er\
  \ dann gegen Abend noch einmal auf Land. In nur 4 Minuten &uuml;berquert er Spanien\
  \ einschlie&szlig;lich der Balearen. Die St&auml;dte Oviedo, Bilbao, Valladolid,\
  \ Valencia und Palma de Mallorca liegen in der Zentralzone, w&auml;hrend Madrid\
  \ knapp außerhalb bleibt.\r\n[INFOSEITE AUF SONNENFINSTERNIS.ORG](sofi2026t/index.htm)\r\
  \n[Zum Seitenanfang](#kopf)\n### 02.08.2027 ([Grafik von *Fred Espenak*](http://eclipse.gsfc.nasa.gov/SEplot/SEplot2001/SE2027Aug02T.GIF))\n\
  Sichtbarkeit in Europa:\nSpanien, Gibraltar\n[SAROS 136](saros136/index.htm)\r\n\
  Die SoFi am 02.08.2027 beginnt \r\n&uuml;ber dem Atlantik auf halbem Weg zwischen\
  \ den Antillen und den Azoren. Auf seinem Weg nach Osten zieht der Kernschatten\
  \ etwa rund 90 Kilometer n&ouml;rdlich an Madeira vorbei. Rund 10 Minuten sp&auml;ter\
  \ erreicht er beiderseits der Stra&szlig;e von Gibraltar das Festland. Auf der afrikanischen\
  \ Seite verdunkelt sich die Sonne in Tanger f&uuml;r 4m49s, auf der europ&auml;ischen\
  \ Seite erlebt Gibraltar die Schwarze Sonne für 4m33s. Die Zentralzone zieht sich\
  \ nun entlang der Nordk&uuml;ste Afrikas, um sich sp&auml;ter immer mehr nach S&uuml;dosten\
  \ zu wenden. Nur rund 100 km &ouml;stlich von Luxor wird mit einer Dauer von 6m23s\
  \ das Maximum der Finsternis erreicht; die Zentralzone ist hier knapp 258 km breit,\
  \ die Sonne steht fast im Zenit. Nachdem der Kernschatten das Rote Meer und die\
  \ arabische Halbinsel &uuml;berquert hat, legt er auf dem Indischen Ozean ohne weiteren\
  \ Landkontakt noch einige 1000 Kilometer zur&uuml;ck, bevor er etwa 1300 Kilometer\
  \ s&uuml;d&ouml;stlich von Sumatra bei Sonnenuntergang die Erdoberfl&auml;che verl&auml;sst.\r\
  \n[INFOSEITE AUF SONNENFINSTERNIS.ORG](sofi2027t/index.htm)\r\n[Zum Seitenanfang](#kopf)"
