  \ ](index.php)\n ](index.php)\n &nbsp; \n ](index.php)\n # J&uuml;dische Feiertage\
  \ 2026\nWas bedeuten die verschiedenen Feiertage und Feste im Judentum? Hier stellen\
  \ wir nicht nur die wichtigen j&uuml;dischen Feste vor, sondern auch Informationen\
  \ zur Bedeutung. Jeder Festtag beginnt am Vorabend, denn im j&uuml;dischen Kalender\
  \ dauert der Tag vom Vorabend (Erew) bis zum Abend des Folgetages. \nAn folgenden\
  \ Daten finden die wichtigsten Feiertage statt:**\n**3. M&auml;rz 2026**\nPurim\
  \ **(Freude)**\n**Adar Purim ist ein Freudenfest, welches Erinnerungen an Fasching\
  \ hochkommen l&auml;sst. Es wird sich kost&uuml;miert und in den Stra&szlig;en gefeiert.\
  \ Man gibt einander Geschenke und spendet Speisen f&uuml;r Bed&uuml;rftige. Zu Purim\
  \ gedenken wir der Befreiung der persischen Juden im 5. Jahrhundert vor unserer\
  \ Zeit. Der h&ouml;chste Regierungsbeamte des persischen K&ouml;nigs, Hamman, wollte\
  \ aus Rache das gesamte j&uuml;dische Volk im Persischen Reich an einem Tag ermorden\
  \ lassen. Ester, die K&ouml;nigin, hat sich beim persischen K&ouml;nig f&uuml;r\
  \ die Rettung ihres Volkes eingesetzt, und der K&ouml;nig erlaubte daraufhin dem\
  \ j&uuml;dischen Volk, sich zu verteidigen.\n2. bis 9. April 2026**\nPessach **(Auszug\
  \ aus &Auml;gypten)**\n**Das Pessach Fest erinnert an den Auszug (Exodus) des j&uuml;dischen\
  \ Volkes aus &Auml;gypten (Mizrajim). Mit dem Fest wird das Ende der Sklaverei des\
  \ j&uuml;dischen Volkes gefeiert. Noch heute wird im Gedenken an dieses Ereignes\
  \ nur Unges&auml;uertes (Matzot) gegessen, weil der pl&ouml;tzliche Aufbruch aus\
  \ &Auml;gypten es nicht gestattet, den Brotteig vor dem Backen s&auml;uern zu lassen.\
  \ Pessach ist der erste Pilgertag nach Jerusalem.\n22. bis 23. Mai 2026&nbsp;**\n\
  ****Schawuot **(Empfang der Tora)**\n**Laut Talmud wurde an Schawuot dem j&uuml;dischen\
  \ Volk von Gott die Zehn Gebote am Berg Sinai verk&uuml;ndet. Es gilt als das j&uuml;dische\
  \ Erntedankfest.&nbsp;\n**12. bis 13. September 2026&nbsp;**\nRosh Hashana **(Neujahrsfest)**\n\
  **Das j&uuml;dische Neujahrsfest richtet sich nach dem Mond. Es markiert den Beginn\
  \ des j&uuml;dischen Jahres. Es wird als Tag des Gerichts (Jom ha-Din) begangen,\
  \ an dem alle Gesch&ouml;pfe vor den \"himmlichen\" Richter treten. Der \"Tag\"\
  \ dauert 48 Stunden. Schofar T&ouml;ne, die an dem Tag erklingen, leiten die Menschen\
  \ zur Bu&szlig;e und Reue, welche den Menschen ihrerseits zu Teschuwa, die R&uuml;ckkehr\
  \ zum Sch&ouml;pfer erleichtern. Wir hoffen auf ein gutes kommendes Jahr und w&uuml;nschen\
  \ einander: (ein Gutes Jahr).&nbsp;\n21. September 2026**\nJom Kippur **(h&ouml;chster\
  \ Feiertag)**\n**Jom Kippur wird als Tag der Vers&ouml;hnung der Juden mit Gott\
  \ bezeichnet. Er ist ein Tag der Besinnung, der Reue und der Bu&szlig;e. Der Tag\
  \ gilt als h&ouml;chster Feiertag.&nbsp;\n26. September bis 2. Oktober 2026**\n\
  Sukkot **(Laubh&uuml;ttenfest)**\n**Es erinnert an die Wanderung der Israeliten\
  \ durch die W&uuml;ste nach dem Auszug aus &Auml;gypten und wird auch Laubh&uuml;ttenfest\
  \ genannt.\n2. Oktober 2026**\nSchmini Atzeret und Simchat Tora **(Abschluss der\
  \ Tora-Lesung)**\n**Damit geht das Laubh&uuml;ttenfest zu Ende. Die Tora und deren\
  \ Gesetzgebung wird gefeiert.\n4. Dezember bis 12. Dezmeber 2026**\nChanukka **(Lichterfest)**\n\
  **Es bedeutet &bdquo;Einweihung&ldquo;, weil es bei der Geschichte des Festes um\
  \ die Einweihung des zweiten Tempels geht. Das Fest wird auch Lichterfest genannt,\
  \ weil jeden Tag eine Kerze auf dem achtarmigen Leuchter entz&uuml;ndet wird.\n\
