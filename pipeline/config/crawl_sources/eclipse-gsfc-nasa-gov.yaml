id: eclipse-gsfc-nasa-gov
# The catalog is split into one page per century. SE-1999--1900.html covers
# 2000-1901 BCE: all 239 of its eclipses have negative years, which
# lib/date.ts's DAY_RE cannot represent at all, so that page yields nothing
# storable. This is the current century's page - 224 eclipses, all CE.
seed_url: https://eclipse.gsfc.nasa.gov/SEcat5/SE2001-2100.html
category: eclipse-gsfc-nasa-gov
scope:
  allowed_domains:
  - eclipse.gsfc.nasa.gov
  path_prefix: /SEcat5
# Stays 0 on purpose: SEcatalog.html links all 50 century pages (~11k
# eclipses, half of them BCE), which is not what this source is for.
max_depth: 0
formats:
- html
# Names every window deterministically. Without it the label comes from an
# LLM pass over the page <title>, which re-rolls on each run.
event_type_hint: Sonnenfinsternis
schedule: manual
extraction_mode: auto
auto_approve_ics: false
